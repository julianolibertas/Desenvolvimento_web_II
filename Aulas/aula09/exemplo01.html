<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situação do Aluno</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col">
        <h1>Programa Situação do Aluno</h1>
        <form action="">
          <p>Nome do aluno:
            <input type="text" id="inNome" required>
          </p>
          <p>1. Nota:
            <input type="number" min="0" max="10" step="0.1" id="inNota1"></p>
          <p>2. Nota:
            <input type="number" min="0" max="10" step="0.1" id="inNota2"></p>
          <input type="submit" class="btn btn-success" value="Exibir média e Situação">
        </form>
        <h3></h3>
        <h4></h4>
      </div>
    </div>
  </div>
  <script src="js/ex01.js"></script>
</body>
</html>
